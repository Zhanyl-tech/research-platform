[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rplat"
version = "0.1.0"
description = "A point-in-time research platform: as-of data, feature lineage, and leakage detection for quantitative research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
keywords = ["quantitative-research", "point-in-time", "bitemporal", "data-quality", "mlops"]
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.5",
    "pandas-stubs",
]

[project.scripts]
rplat = "rplat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rplat"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "S"]
ignore = [
    # The as-of SQL is assembled from Dataset enum members and FACT_KEYS
    # constants, never from caller input. See rplat/store/schema.py.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
# Tests are meant to assert, and their fixture URLs are not network calls.
"tests/*" = ["S101"]

[tool.mypy]
# Deliberately no `python_version` pin. The CI matrix runs each interpreter it
# claims to support, and mypy should type-check against the one it is running
# under. Pinning 3.11 here made mypy parse numpy's 3.12-only `type` statements
# under 3.11 syntax rules and fail on the 3.12 runner.
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

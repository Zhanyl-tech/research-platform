name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the project claims; 3.12 catches deprecations early.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      # The README promises `make demo` runs with no network and no
      # credentials. Prove it on every push rather than trusting it still does.
      - name: Demo runs end to end
        run: |
          python -m rplat.cli demo | tee demo.out
          grep -q "eps_diluted = 1.5" demo.out
          grep -q "eps_diluted = 1.2" demo.out
          grep -q "0 of 5 sessions visible" demo.out

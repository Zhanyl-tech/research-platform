name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository or creates releases.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the project claims; 3.12 and 3.13 catch deprecations early.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      # The gate sits below the coverage measured when it was added (98%) so
      # that a refactor does not trip it, but a new untested module does.
      - name: Test, with coverage gate
        run: pytest -q --cov=rplat --cov-report=term-missing --cov-fail-under=90

      # The README promises `make demo` runs with no network and no
      # credentials. Prove it on every push rather than trusting it still does.
      - name: Demo runs end to end
        run: |
          python -m rplat.cli demo | tee demo.out
          grep -q "eps_diluted = 1.5" demo.out
          grep -q "eps_diluted = 1.2" demo.out
          grep -q "0 of 5 sessions visible" demo.out
          grep -q "factor 1.0; announced 2022-08-25, not yet effective" demo.out

  lowest:
    # pyproject's lower bounds (duckdb>=1.0, pandas>=2.1, ...) are claims.
    # Install exactly those floors for every direct dependency and run the
    # suite, so a floor that no longer works fails here instead of for a user.
    # https://docs.astral.sh/uv/concepts/resolution/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lowest direct dependencies
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e ".[dev]"
          python -m pip list
      - name: Test
        run: pytest -q

  package:
    # Build the wheel, install it into a clean venv, and run it from outside
    # the checkout, so the hatch `packages` config and py.typed are exercised.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and run the demo from outside the repo
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/rplat" demo | tee demo.out
          grep -q "eps_diluted = 1.2" demo.out
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import importlib.resources as r; assert r.files('rplat').joinpath('py.typed').is_file()"
